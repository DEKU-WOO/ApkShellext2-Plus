name: Build Windows Shell Extension
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build ApkShellext2
        run: MSBuild.exe ApkShellext2\ApkShellext2.csproj -p:Configuration=Release -restore
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApkShellext2-Plus-Release
          path: ApkShellext2\bin\Release\**
